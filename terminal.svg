<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .prompt { fill: #2DD4BF; }
      .cmd { fill: #e6edf3; }
      .out-white { fill: #c9d1d9; }
      .out-blue { fill: #79b8ff; }
      .out-teal { fill: #2DD4BF; }
      .out-muted { fill: #8b949e; }
      .out-yellow { fill: #e3b341; }
      .cursor {
        fill: #2DD4BF;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Window background -->
  <rect width="720" height="380" rx="12" ry="12" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="720" height="38" rx="12" ry="12" fill="#161b22"/>
  <rect y="26" width="720" height="12" fill="#161b22"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="6" fill="#febc2e"/>
  <circle cx="60" cy="19" r="6" fill="#28c840"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="12" fill="#8b949e" class="mono">sumit@github — bash</text>

  <!-- Line 1: whoami command -->
  <text x="24" y="72" font-size="13" class="mono prompt">sumit@github:~$</text>
  <text x="162" y="72" font-size="13" class="mono cmd"> whoami</text>

  <!-- Line 2: whoami output -->
